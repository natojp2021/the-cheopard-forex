[pytest]
testpaths = tests
python_files = test_*.py
# refactor 27/07 (refactor.md §7): cây test đã hợp nhất về tests/ — trước đó
# src/python/test/ và src/python/tests/ nằm NGOÀI testpaths nên 77 test (gồm
# test_lifecycle_new_strategies.py 2266 dòng) chưa bao giờ được CI chạy.
# tests/manual/ = script chạy tay có đọc parquet/model artifact THẬT: loại khỏi
# thu thập tự động (chặn 2 lớp — norecursedirs ở đây, và tên file không khớp
# python_files ở trên).
norecursedirs = tests/manual .git __pycache__ .pytest_cache

# ---------------------------------------------------------------------------
# filterwarnings (28/07, dòng "generic unit for NumPy timedelta" XOÁ 28/07 —
# pandas đã lên 3.0.3, không còn phát cảnh báo đó nữa, đúng như
# `tests/test_warning_hygiene_20260728.py::test_filter_numpy_timedelta_van_con_can_thiet`
# được thiết kế để phát hiện — xem lịch sử git nếu cần lại lý do gốc) — CHỈ
# dành cho cảnh báo của THƯ VIỆN mà callsite của ta đã đúng. Cảnh báo phát
# sinh từ code của ta thì phải SỬA CODE, không thêm vào đây.
#
# sdv khuyên `save_to_json` metadata — lời khuyên về replicability khi LƯU
# model production; test synthetic-data chỉ fit/sample trong bộ nhớ nên không
# áp dụng.
# ---------------------------------------------------------------------------
filterwarnings =
    ignore:We strongly recommend saving the metadata using 'save_to_json':UserWarning

# ---------------------------------------------------------------------------
# markers (04/08)
# ---------------------------------------------------------------------------
markers =
    doc_cau_hinh_that: test ĐỌC hằng số cấu hình production (đường dẫn state, SSOT)
        và vì thế phải THOÁT khỏi fixture `_isolate_runtime_state`. Fixture đó
        redirect các hằng số ấy sang tmp; nếu áp lên loại test này thì chúng đo
        tmp thay vì đo production và không còn bảo vệ được gì. KHÔNG dùng marker
        này để né fixture cho test khó — test mang marker phải chỉ đọc hằng số,
        tuyệt đối không gọi đường vào lệnh.
    kiem_thu_econ_fetcher: test kiểm CHÍNH `fetch_economic_snapshot()` (ghép 5
        nguồn Tier S, fail-soft từng phần) nên phải THOÁT khỏi fixture
        `_block_real_econ_fetch` — fixture đó thay hàm bằng bản trả rỗng, tức sẽ
        thay mất đúng thứ đang được kiểm. Test mang marker này phải tự giả lập
        tầng HTTP (`requests`), KHÔNG được đi ra mạng thật.
